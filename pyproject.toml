[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-skin-release-statistics"
description = "League of Legends skin release statistics."
version = "0.1.0"
readme = "README.md"
requires-python = "~=3.8,<3.14"

dependencies = [
    "beautifulsoup4~=4.13.5",
    "luadata~=1.0.5",
    "ruff~=0.16.5",
    "tqdm~=4.67.1",
    "typing-extensions~=4.13.0",
]

[project.scripts]
classify-lol-patches = "lol_skin_release_statistics.classify_patches:main"
collect-lol-wiki = "lol_skin_release_statistics.collect_wiki:main"
import-leagueofgraphs-html = "lol_skin_release_statistics.import_leagueofgraphs:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "local_code/*",
    "dev/*",
    "ml_applications/proto/*",
]

line-length = 120
indent-width = 4

target-version = "py38"

[tool.ruff.lint]
select = ["ALL"]
exclude = ["tests/*"]
ignore = [
    "Q000",
    "RET504",
    "D202",
    "D203",
    "D406",
    "D407",
    "FBT001",
    "FBT002",
    "PLR0913",
    "PLR0917",
    "PLE1205",
    "UP032",
    "D211",
    "D213",
    "Q000",
    "Q003",
    "COM812",
    "CPY001",
    "ISC001",
    "LOG004",
    "PERF203",
    "TRY003",
    "ANN003",
    "ANN401",
    "PLE1205",
    "EXE002",
    "PLC0206",
    "CPY001",
    "LOG004",
]


# [tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
